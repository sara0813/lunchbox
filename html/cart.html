<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>장바구니</title>
    <script>
        const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        const base = document.createElement('base');
        base.href = isLocal ? '../' : '/lunchbox/';
        document.head.appendChild(base);
    </script>
    <link href="css/index.css" rel="stylesheet">
    <link href="css/cart.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div id="header"></div>

    <div class="container cart-container">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
            <h2 class="fw-bold">장바구니</h2>
            <button class="btn btn-outline-danger btn-sm" onclick="deleteSelected()">선택상품 삭제</button>
        </div>

        <!-- 장바구니 상품 목록 -->
        <div id="cart-items" class="vstack gap-3">
            <!-- 상품 1: 닭가슴살 큐브 + 단호박 -->
            <div class="product border rounded p-3 d-flex align-items-center gap-3 shadow-sm" data-price="6900">
                <input type="checkbox" class="product-check form-check-input mt-0" checked>
                <button class="delete-btn btn-close ms-auto" aria-label="삭제"></button>
                <img src="images/6.png" alt="닭가슴살 큐브 + 단호박" width="80" class="rounded">
                <div class="flex-grow-1">
                    <div class="fw-semibold">닭가슴살 큐브 + 단호박</div>
                    <div class="text-muted small">배송비 무료</div>
                    <div class="fw-bold text-danger">₩6,900
                        <span class="text-decoration-line-through text-muted fw-normal ms-2 small">₩8,200</span>
                    </div>
                    <div class="quantity-controls mt-2 d-flex gap-2 align-items-center">
                        <button class="minus btn btn-outline-secondary btn-sm">-</button>
                        <span class="qty">1</span>
                        <button class="plus btn btn-outline-secondary btn-sm">+</button>
                    </div>
                </div>
            </div>

            <!-- 상품 2: 연어 스테이크 + 현미밥 -->
            <div class="product border rounded p-3 d-flex align-items-center gap-3 shadow-sm" data-price="8500">
                <input type="checkbox" class="product-check form-check-input mt-0" checked>
                <button class="delete-btn btn-close ms-auto" aria-label="삭제"></button>
                <img src="images/3.png" alt="연어 스테이크 + 현미밥" width="80" class="rounded">
                <div class="flex-grow-1">
                    <div class="fw-semibold">연어 스테이크 + 현미밥</div>
                    <div class="text-muted small">배송비 무료</div>
                    <div class="fw-bold text-danger">₩8,500
                        <span class="text-decoration-line-through text-muted fw-normal ms-2 small">₩8,900</span>
                    </div>
                    <div class="quantity-controls mt-2 d-flex gap-2 align-items-center">
                        <button class="minus btn btn-outline-secondary btn-sm">-</button>
                        <span class="qty">1</span>
                        <button class="plus btn btn-outline-secondary btn-sm">+</button>
                    </div>
                </div>
            </div>

            <!-- 상품 3: 닭가슴살 김치볶음밥 -->
            <div class="product border rounded p-3 d-flex align-items-center gap-3 shadow-sm" data-price="6200">
                <input type="checkbox" class="product-check form-check-input mt-0" checked>
                <button class="delete-btn btn-close ms-auto" aria-label="삭제"></button>
                <img src="images/14.png" alt="닭가슴살 김치볶음밥" width="80" class="rounded">
                <div class="flex-grow-1">
                    <div class="fw-semibold">닭가슴살 김치볶음밥</div>
                    <div class="text-muted small">배송비 무료</div>
                    <div class="fw-bold text-danger">₩6,200
                        <span class="text-decoration-line-through text-muted fw-normal ms-2 small">₩6,900</span>
                    </div>
                    <div class="quantity-controls mt-2 d-flex gap-2 align-items-center">
                        <button class="minus btn btn-outline-secondary btn-sm">-</button>
                        <span class="qty">1</span>
                        <button class="plus btn btn-outline-secondary btn-sm">+</button>
                    </div>
                </div>
            </div>
        </div>


        <div id="empty-message" class="text-center text-danger fw-bold mt-4" style="display:none;">
            장바구니에 담긴 상품이 없습니다.
        </div>

        <div class="total text-end mt-4 fs-5 fw-bold">
            TOTAL: ₩<span id="total-price">0</span>
        </div>

        <div class="order-actions d-flex justify-content-end gap-2 mt-3">
            <button class="btn btn-outline-dark" onclick="orderSelected()">선택상품 주문</button>
            <button class="btn btn-dark" onclick="orderAll()">전체상품 주문</button>
        </div>
    </div>

    <div id="footer" class="mt-5"></div>

    <script src="js/randomBanner.js"></script>
    <script src="js/loadHeader.js"></script>
    <script src="js/loadFooter.js"></script>
    <script src="js/cart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
