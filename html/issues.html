<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>취소/반품/교환 내역 - HEALTHYME</title>
  <script>
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const base = document.createElement('base');
    base.href = isLocal ? '../' : '/lunchbox/';
    document.head.appendChild(base);
  </script>
  <link href="css/sidebar.css" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
  <link href="css/order.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div id="header"></div>

  <main class="container my-5">
    <div class="row">
      <!-- 사이드바 -->
      <div id="sidebar" class="col-md-3 mb-4"></div>

      <!-- 취소/반품/교환 내역 본문 -->
      <section class="col-md-9">
        <h3 class="fw-bold mb-4 border-bottom pb-2">취소/반품/교환 내역</h3>

        <!-- 내역 테이블 -->
        <div class="table-responsive rounded bg-white p-4 shadow-sm">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr style="height: 60px;">
                <th>신청번호</th>
                <th>유형</th>
                <th>상품명</th>
                <th>수량</th>
                <th>처리상태</th>
                <th>신청일</th>
                <th>사유</th>
              </tr>
            </thead>
            <tbody>
              <tr style="height: 70px;">
                <td>#C20240501</td>
                <td><span class="badge bg-danger">취소</span></td>
                <td>닭가슴살 볶음밥 도시락</td>
                <td>1</td>
                <td><span class="badge bg-secondary">처리 완료</span></td>
                <td>2025-05-26</td>
                <td>중복 주문</td>
              </tr>
              <tr style="height: 70px;">
                <td>#R20240502</td>
                <td><span class="badge bg-warning text-dark">반품</span></td>
                <td>단백질 고구마 도시락</td>
                <td>2</td>
                <td><span class="badge bg-info text-dark">처리 중</span></td>
                <td>2025-05-25</td>
                <td>상품 파손</td>
              </tr>
              <tr style="height: 70px;">
                <td>#E20240503</td>
                <td><span class="badge bg-primary">교환</span></td>
                <td>현미밥 도시락</td>
                <td>1</td>
                <td><span class="badge bg-success">교환 완료</span></td>
                <td>2025-05-24</td>
                <td>오배송</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/randomBanner.js"></script>
  <script src="js/loadHeader.js"></script>
  <script src="js/loadFooter.js"></script>
  <script src="js/loadSidebar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
