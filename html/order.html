<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문 내역 - HEALTHYME</title>
  <script>
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const base = document.createElement('base');
    base.href = isLocal ? '../' : '/lunchbox/';
    document.head.appendChild(base);
  </script>
  <link href="css/sidebar.css" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div id="header"></div>

  <main class="container my-5">
    <div class="row">
      <!-- 사이드바 -->
      <div id="sidebar" class="col-md-3 mb-4"></div>

      <!-- 주문 내역 본문 -->
      <section class="col-md-9">
        <h3 class="fw-bold mb-4 border-bottom pb-2">주문 내역</h3>

        <!-- 주문 내역 리스트 -->
        <div class="table-responsive rounded bg-white p-4 shadow-sm">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr style="height: 60px;">
                <th>주문번호</th>
                <th>상품명</th>
                <th>수량</th>
                <th>결제</th>
                <th>배송</th>
                <th>주문일</th>
              </tr>
            </thead>
            <tbody>
              <tr style="height: 70px;">
                <td>#20240529001</td>
                <td>오트밀 닭가슴살 도시락</td>
                <td>2</td>
                <td><span class="badge bg-success">결제 완료</span></td>
                <td><span class="badge bg-warning text-dark">배송 중</span></td>
                <td>2025-05-28</td>
              </tr>
              <tr style="height: 70px;">
                <td>#20240527005</td>
                <td>곤약 볶음밥 도시락</td>
                <td>1</td>
                <td><span class="badge bg-secondary">결제 취소</span></td>
                <td>-</td>
                <td>2025-05-27</td>
              </tr>
              <tr style="height: 70px;">
                <td>#20240526003</td>
                <td>고구마 단백질 도시락</td>
                <td>3</td>
                <td><span class="badge bg-success">결제 완료</span></td>
                <td><span class="badge bg-info text-dark">배송 완료</span></td>
                <td>2025-05-26</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/randomBanner.js"></script>
  <script src="js/loadHeader.js"></script>
  <script src="js/loadFooter.js"></script>
  <script src="js/loadSidebar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
